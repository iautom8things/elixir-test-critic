<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
  <title id="t">Suds, the Shampoo mascot</title>
  <desc id="d">A purple drop-shaped shampoo bottle with an orange pump seated on its tilted tip, holding up a square flake it just caught.</desc>
  <g transform="translate(-8 -8)" stroke="#3b1f7a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- flakes: the caught one sits behind the hand, two fall away -->
    <g fill="#a98af0">
      <rect x="319" y="147" width="30" height="30" rx="3" transform="rotate(18 334 162)"/>
      <rect x="340" y="258" width="22" height="22" rx="2" transform="rotate(-22 351 269)"/>
      <rect x="358" y="316" width="17" height="17" rx="2" transform="rotate(30 366 324)"/>
    </g>
    <path d="M362 136 L372 128 M366 162 L378 164 M344 126 L346 114" fill="none" stroke="#f7a12f" stroke-width="6"/>

    <!-- arms and mitten hands, one outline around each union -->
    <g fill="#3b1f7a">
      <path d="M276 258 C304 254 320 230 326 202" fill="none" stroke-width="28"/>
      <circle cx="327" cy="194" r="21" stroke="none"/>
      <circle cx="314" cy="184" r="14" stroke="none"/>
      <path d="M116 292 Q92 292 78 272" fill="none" stroke-width="28"/>
      <circle cx="74" cy="264" r="21" stroke="none"/>
    </g>
    <g fill="#7048cc" stroke="#7048cc">
      <path d="M276 258 C304 254 320 230 326 202" fill="none" stroke-width="12"/>
      <circle cx="327" cy="194" r="13" stroke="none"/>
      <circle cx="314" cy="184" r="6" stroke="none"/>
      <path d="M116 292 Q92 292 78 272" fill="none" stroke-width="12"/>
      <circle cx="74" cy="264" r="13" stroke="none"/>
    </g>

    <!-- body -->
    <path d="M226 115 C233 152 294 207 294 278 C294 337 253 376 200 376 C147 376 106 337 106 278 C106 210 194 164 226 115 Z" fill="#7048cc"/>
    <path d="M138 231 C128 249 123 266 125 290" fill="none" stroke="#a98af0" stroke-width="10"/>
    <circle cx="130" cy="312" r="5" fill="#a98af0" stroke="none"/>

    <!-- pump, seated on the tip -->
    <g transform="translate(226 115) rotate(10)">
      <rect x="-8" y="-34" width="16" height="30" fill="#f7a12f"/>
      <rect x="-20" y="-8" width="42" height="30" rx="9" fill="#f7a12f"/>
      <g transform="translate(0 -32) rotate(-12)">
        <g fill="#3b1f7a" stroke-width="16">
          <rect x="-17" y="-34" width="36" height="34" rx="8"/>
          <path d="M-14 -29 L-50 -29 Q-57 -29 -58 -22 L-60 -11 L-48 -11 L-47 -17 L-14 -17 Z"/>
        </g>
        <g fill="#f7a12f" stroke="none">
          <rect x="-17" y="-34" width="36" height="34" rx="8"/>
          <path d="M-14 -29 L-50 -29 Q-57 -29 -58 -22 L-60 -11 L-48 -11 L-47 -17 L-14 -17 Z"/>
        </g>
        <path d="M-8 -26 H10" stroke="#fff" stroke-width="5"/>
      </g>
      <!-- foam crown around the stem base -->
      <g fill="#3b1f7a" stroke-width="16">
        <circle cx="-14" cy="-13" r="9"/>
        <circle cx="0" cy="-18" r="10"/>
        <circle cx="14" cy="-16" r="9"/>
        <circle cx="23" cy="-9" r="6"/>
      </g>
      <g fill="#fff" stroke="none">
        <circle cx="-14" cy="-13" r="9"/>
        <circle cx="0" cy="-18" r="10"/>
        <circle cx="14" cy="-16" r="9"/>
        <circle cx="23" cy="-9" r="6"/>
      </g>
    </g>
    <!-- a bubble the pump just let go -->
    <circle cx="144" cy="66" r="12" fill="#fff"/>
    <path d="M138 66 Q138 60 144 59" fill="none" stroke="#a98af0" stroke-width="4"/>

    <!-- face, turned a little toward the catch -->
    <g stroke="none" fill="#3b1f7a">
      <ellipse cx="186" cy="266" rx="12" ry="16"/>
      <ellipse cx="234" cy="264" rx="12" ry="16"/>
    </g>
    <circle cx="190.5" cy="259.5" r="4.5" fill="#fff" stroke="none"/>
    <circle cx="238.5" cy="257.5" r="4.5" fill="#fff" stroke="none"/>
    <path d="M197 301 Q216 312 233 293" fill="none" stroke-width="7"/>
  </g>
</svg>
